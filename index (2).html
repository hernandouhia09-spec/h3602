<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hogar360</title>
<style>
:root{--navy:#14317a;--dk:#0d2257;--lime:#84c91d;--bg:#f3f5fa;--card:#fff;--tx:#1b2233;--mu:#6b7488;--bd:#e3e7ef;--or:#f59e0b;--rd:#d8283a;font-size:16px}
:root.hc{--bg:#fff;--tx:#000;--mu:#222;--bd:#000;--lime:#4d8a00;--navy:#000}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:#cdd4e3;font-family:"Work Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx)}
#app{max-width:430px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
.sc{flex:1;overflow-y:auto;padding:8px 20px 20px}
.navy{background:var(--navy);color:#fff}
.full{flex:1;display:flex;flex-direction:column;align-items:center;padding:40px 28px 0;gap:14px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.7rem;color:#fff}
.logo svg{width:34px;height:42px}
h1{font-size:1.9rem;line-height:1.2;text-align:center;margin:60px 0 40px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:14px;height:52px;font:700 1rem inherit;font-family:inherit;cursor:pointer;background:var(--lime);color:#fff}
.btn.w{background:#fff;color:#5b6477}.btn.l{background:#e1ebfb;color:var(--navy)}.btn.n{background:var(--navy);color:#fff}
.btn.g{background:var(--card);color:var(--navy);border:1.5px solid var(--navy)}
.btn.rd{background:#fde8ea;color:var(--rd);border:1px solid var(--rd);justify-content:space-between;padding:0 20px}
.btn.sm{height:30px;width:auto;padding:0 20px;font-size:.8rem;border-radius:9px}
.legal{margin-top:auto;width:calc(100% + 56px);text-align:center;background:var(--dk);padding:12px;font-size:.8rem;color:#cdd7ee}
.sheet{background:var(--card);border-radius:28px 28px 0 0;padding:26px 22px;margin-top:auto;width:calc(100% + 56px);color:var(--tx)}
label{display:block;font-weight:600;font-size:.9rem;color:var(--mu);margin:10px 0 6px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time]{width:100%;height:48px;border:1.5px solid var(--bd);border-radius:12px;padding:0 14px;font:1rem inherit;font-family:inherit;background:var(--card);color:var(--tx)}
.ok{color:var(--lime);font-size:.8rem;font-weight:600;min-height:1.2em;margin-top:4px}.er{color:var(--rd);font-size:.85rem;min-height:1.2em;margin:6px 0}
.hd{display:flex;align-items:center;gap:12px;padding:12px 20px;height:64px}
.hd h2{margin:0;font-size:1.1rem;flex:1}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid var(--bd);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx);padding:0;flex:none;position:relative}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.av{width:41px;height:41px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.av.b{width:80px;height:80px;font-size:1.7rem;margin:6px auto 10px}
.dot{position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--or)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px}
.pc{display:flex;gap:14px;flex-wrap:wrap;position:relative}
.ph{width:129px;height:149px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:2.6rem;flex:none}
.pi{flex:1;min-width:130px}.pi b{display:block}.mu{color:var(--mu);font-size:.85rem}
.pr{font-size:1.45rem;font-weight:800;color:var(--navy);margin:4px 0 10px}
.hh{position:absolute;top:0;right:0;background:none;border:0;font-size:1.3rem;cursor:pointer;color:var(--rd)}
.st{display:flex;width:100%;border-top:1px solid var(--bd);padding-top:12px;text-align:center;font-size:.8rem}
.st div{flex:1;border-right:1px solid var(--bd)}.st div:last-child{border:0}
.row{display:flex;align-items:center;justify-content:space-between;padding:15px 4px;border-bottom:1px solid var(--bd);cursor:pointer;font-weight:600}
.row:last-child{border:0}
.pill{background:#fdecd0;color:#c77700;border-radius:99px;padding:3px 10px;font-size:.72rem;font-weight:700;margin-right:6px}
.ver{background:#e7f5d0;color:#3f7d00;border-radius:99px;padding:8px 18px;font-weight:700;font-size:.85rem;display:inline-flex;gap:8px;border:1px solid var(--lime)}
.tg{width:48px;height:24px;border-radius:99px;background:#b9c0d0;border:0;position:relative;cursor:pointer;flex:none}
.tg::after{content:"";position:absolute;top:4px;left:4px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--lime)}.tg.on::after{left:28px}
.bx{background:#e1ebfb;border-radius:16px;padding:16px;margin-bottom:14px;font-size:.9rem;line-height:1.45}
.res{background:var(--navy);color:#fff;border-radius:18px;padding:20px;margin:16px 0}.res b{font-size:2rem;display:block}
input[type=range]{width:100%;accent-color:var(--lime)}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 0 8px;font:.75rem inherit;font-family:inherit;cursor:pointer;border-top:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--navy);border-top-color:var(--navy);font-weight:700;width:auto}
.mo{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:28px;z-index:9}
.mb{background:var(--card);border-radius:20px;padding:22px;width:100%;text-align:center}.mb h3{margin:6px 0 14px}
.sh{font-size:.78rem;font-weight:700;letter-spacing:.08em;color:var(--mu);margin:18px 0 10px}
.ic{width:46px;height:46px;border-radius:50%;background:#e1ebfb;color:var(--navy);display:flex;align-items:center;justify-content:center;flex:none;font-size:1.2rem}
.it{display:flex;gap:14px;align-items:flex-start}
.gal{height:170px;border-radius:16px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;font-size:3rem}
</style>
</head>
<body>
<div id="app"></div>
<script>
var KEY="hogar360fig",$=function(i){return document.getElementById(i)};
var S={user:null,fav:[],visits:[{n:"Apto en Torres del Bosque",d:"Sábado, 18 May",h:"10:30 AM",st:"PENDIENTE DE CONFIRMACIÓN"}],docs:[1,1,0,0,1],big:0,hc:0,voz:0,fa:1,bio:1,ing:4500000,ini:35000000,yrs:15};
try{var r=localStorage.getItem(KEY);if(r)Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var P=[{id:1,n:"Torres del Bosque",z:"Fontibón",s:"Apartamentos cerca a la calle 26",p:275000000,h:2,b:2,m:35,g:"#7fb3e8,#14317a",e:"🏢",d:"Estos apartamentos en Fontibón ofrecen un estilo moderno y funcional, ideales para jóvenes profesionales o familias que buscan comodidad y buena ubicación. Torres del Bosque combina zonas verdes, piscina y áreas comunes con acceso rápido a la Calle 26 y al aeropuerto."},
{id:2,n:"Torres del Senderos",z:"Soacha",s:"Conjunto residencial con zonas comunes",p:220000000,h:3,b:2,m:34,g:"#e9b872,#a8452b",e:"🏘️",d:"Torres del Senderos ofrece apartamentos amplios de tres habitaciones, piscina y zonas verdes, con excelente conexión hacia Bogotá por la autopista sur."}];
var cur="splash",pid=1,err="",M=null,q="",ent={};
var IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',chev:'<path d="M9 6l6 6-6 6"/>',back:'<path d="M15 6l-6 6 6 6"/>',bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',out:'<path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/>',bed:'<path d="M3 18v-7h18v7M3 14h18M6 11V8h5v3"/>',bath:'<path d="M4 12h16v2a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4zM6 12V6a2 2 0 0 1 4 0"/>',area:'<rect x="5" y="5" width="14" height="14"/><path d="M5 12h14"/>',pin:'<path d="M12 21s-6-6-6-11a6 6 0 0 1 12 0c0 5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/>',shield:'<path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>'};
function i(n){return '<svg class="i" viewBox="0 0 24 24">'+IC[n]+'</svg>';}
function $m(n){return "$"+Number(n).toLocaleString("es-CO");}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]});}
function P1(id){return P.filter(function(x){return x.id==id})[0];}
function go(s,x){cur=s;if(x)pid=x;err="";M=null;q=s=="home"?q:"";render();}
function modal(m){M=m;render();}
function LOGO(){return '<div class="logo"><svg viewBox="0 0 34 42"><path d="M17 41S2 26 2 15a15 15 0 0 1 30 0c0 11-15 26-15 26z" fill="#fff"/><path d="M10 20v-7l5-3 5 3v7z" fill="#14317a"/><rect x="21" y="15" width="5" height="7" fill="#84c91d"/></svg>Hogar<span style="font-weight:400">360</span></div>';}
function hd(t,b,right){return '<div class="hd"><button class="ib" onclick="go(\''+(b||"home")+'\')">'+i("back")+'</button><h2>'+t+'</h2>'+(right||"")+'</div>';}
function nav(){var t=[["home","home","Inicio"],["search","search","Buscar"],["citas","cal","Visitas"],["perfil","user","Perfil"]];
var act={home:"home",detalle:"home",simulador:"home",agendar:"citas",citas:"citas",notifs:"home",ayuda:"perfil",guia:"perfil",perfil:"perfil",seguridad:"perfil",access:"perfil",docs:"perfil"}[cur];
return '<nav>'+t.map(function(x){return '<button class="'+(act==x[0]?"on":"")+'" onclick="'+(x[0]=="search"?"buscar()":"go(\''+x[0]+'\')")+'">'+i(x[1])+x[2]+'</button>'}).join("")+'</nav>';}
function buscar(){go("home");setTimeout(function(){var e=$("qs");if(e)e.focus();},50);}
function ini(){var n=(S.user&&S.user.name)||"Valentina Rodríguez";return n.split(" ").map(function(w){return w[0]||""}).join("").slice(0,2).toUpperCase();}
function nom(){return (S.user&&S.user.name)||"Valentina Rodríguez";}
function chk(id){var e=$(id);return e?e.value.trim():"";}
function entrar(){var e=chk("em"),p=$("pw").value;
 if(!/^\S+@\S+\.\S+$/.test(e)){err="Ingresa un correo válido";return render(1);}
 if(p.length<6){err="La contraseña debe tener al menos 6 caracteres";return render(1);}
 var nm=S.user&&S.user.email==e?S.user.name:e.split("@")[0].replace(/[._]/g," ").replace(/\b\w/g,function(c){return c.toUpperCase()});
 S.user={name:nm,email:e};save();go("home");}
function pw(){var ok=$("pw").value.length>=6;$("pwok").innerHTML=ok?"✔ Contraseña correcta":"";}
function huella(){if(!S.bio){err="La huella está desactivada en Seguridad";return render(1);}S.user=S.user||{name:"Valentina Rodríguez",email:"valentina.rod@mail.com"};save();go("home");}
function google(){S.user=S.user||{name:"Valentina Rodríguez",email:"valentina.rod@mail.com"};save();go("home");}
function crear(){var n=chk("rn"),e=chk("re"),a=$("rp").value,b=$("rc").value;
 if(n.length<3)err="Escribe tu nombre";else if(!/^\S+@\S+\.\S+$/.test(e))err="Correo no válido";else if(a.length<6)err="La contraseña debe tener al menos 6 caracteres";else if(a!=b)err="Las contraseñas no coinciden";else{S.user={name:n,email:e};save();return go("home");}
 render(1);}
function fav(id){var k=S.fav.indexOf(id);k<0?S.fav.push(id):S.fav.splice(k,1);save();render();}
function sim(){S.ing=+$("si").value||0;S.ini=+$("sd").value||0;S.yrs=+$("sy").value;save();var c=cap();$("sr").textContent=$m(c);$("sa").textContent=S.yrs+" años";}
function cap(){var loan=S.ing*0.4*S.yrs*12*0.7407;return Math.round((S.ini+loan)/1e6)*1e6;}
function agenda(){var d=$("fd").value,h=$("fh").value;if(!d||!h){err="Elige fecha y hora";return render(1);}
 var p=P1(pid);S.visits.unshift({n:"Apto en "+p.n,d:fecha(d),h:hora(h),st:"PENDIENTE DE CONFIRMACIÓN"});save();M="cita";render();}
function fecha(d){var s=new Date(d+"T12:00").toLocaleDateString("es-CO",{weekday:"long",day:"numeric",month:"short"});return s.charAt(0).toUpperCase()+s.slice(1);}
function hora(h){var a=h.split(":"),n=+a[0];return (n%12||12)+":"+a[1]+(n>=12?" PM":" AM");}
function canc(k){S.visits.splice(k,1);save();render();}
function tg(k){S[k]=S[k]?0:1;if(k=="hc")ap();if(k=="voz"&&S.voz)hablar("Asistencia por voz activada");save();render();}
function tam(d){S.big=Math.max(-2,Math.min(3,S.big+d));ap();save();render();}
function ap(){document.documentElement.style.fontSize=(16+S.big*2)+"px";document.documentElement.classList.toggle("hc",!!S.hc);}
function hablar(t){try{if(S.voz&&window.speechSynthesis)speechSynthesis.speak(new SpeechSynthesisUtterance(t));}catch(e){}}
function doc(k){S.docs[k]=S.docs[k]?0:1;save();render();}
function salir(){S.user=null;save();go("onb");}
function tel(){return '<button class="btn" onclick="modal(\'asesor\')">Hablar con un asesor</button>';}
function render(keep){
 var h="",a=$("app"),k=keep?{em:chk("em"),rn:chk("rn"),re:chk("re")}:{};
 ap();
 if(cur=="splash"){h='<div class="full navy" style="justify-content:center">'+LOGO()+'<div style="margin-top:20px;font-size:1.1rem">Bienvenid@</div></div>';setTimeout(function(){if(cur=="splash")go(S.user?"home":"onb")},1400);}
 else if(cur=="onb"){h='<div class="full navy">'+LOGO()+'<h1>Encuentra tu próximo hogar</h1><button class="btn" onclick="go(\'login\')">Empezar ahora</button><div style="height:30px"></div><button class="btn w" onclick="google()"><b style="color:#4285f4;font-size:1.2rem">G</b> Iniciar con Google</button><div class="legal">Términos de uso · Política de privacidad</div></div>';}
 else if(cur=="login"){h='<div class="full navy" style="padding-top:28px;gap:0"><div class="hd" style="width:100%;padding:0"><button class="ib" style="color:#fff;background:none;border-color:#fff4" onclick="go(\'onb\')">'+i("back")+'</button></div>'+LOGO()+'<div class="sheet" style="margin-top:30px"><label>Correo electrónico</label><input id="em" type="email" placeholder="valentina.rod@mail.com" value="'+esc(k.em||"")+'"><label>Contraseña</label><input id="pw" type="password" placeholder="••••••••" oninput="pw()"><div class="ok" id="pwok"></div><div class="er">'+err+'</div><button class="btn l" onclick="entrar()">Iniciar sesión</button><div style="height:12px"></div><button class="btn" onclick="go(\'onb\')">Cancelar</button><div style="text-align:center;margin:18px 0 8px;font-size:2.6rem;cursor:pointer" onclick="huella()">👆</div><div style="text-align:center;color:var(--navy);font-weight:700;cursor:pointer" onclick="huella()">Toca para iniciar sesión con huella</div><p style="text-align:center;font-size:.9rem">¿No tienes cuenta? <a href="#" style="color:var(--navy);font-weight:700" onclick="go(\'registro\');return false">Regístrate aquí</a></p></div></div>';}
 else if(cur=="registro"){h=hd("Registrarse","login")+'<div class="sc"><label>Nombre</label><input id="rn" type="text" value="'+esc(k.rn||"")+'"><label>Correo electrónico</label><input id="re" type="email" value="'+esc(k.re||"")+'"><label>Contraseña</label><input id="rp" type="password"><label>Confirmar contraseña</label><input id="rc" type="password"><div class="er">'+err+'</div><button class="btn" onclick="crear()">Crear cuenta</button></div>';}
 else if(cur=="home"){var L=P.filter(function(p){return !q||(p.n+" "+p.z).toLowerCase().indexOf(q.toLowerCase())>=0});
  h='<div class="hd"><button class="ib" onclick="go(\'perfil\')">'+i("back")+'</button><div class="av">'+ini()+'</div><div style="flex:1"><b>Hola, '+esc(nom().split(" ")[0])+'</b><div class="mu">Panel principal</div></div><button class="ib" onclick="go(\'notifs\')">'+i("bell")+'<span class="dot"></span></button></div><div class="sc"><div style="position:relative;margin-bottom:16px"><input id="qs" type="text" placeholder="Buscar apartamento o zona" value="'+esc(q)+'" oninput="q=this.value;lista()"></div><div id="lst">'+listaH(L)+'</div></div>'+nav();}
 else if(cur=="detalle"){var p=P1(pid);h=hd("Apartamento","home")+'<div class="sc"><div class="gal" style="background:linear-gradient(135deg,'+p.g+')">'+p.e+'</div><div style="display:flex;justify-content:space-between"><div class="pr" style="font-size:1.9rem;margin:0">'+$m(p.p)+'</div><button class="ib" style="color:var(--rd)" onclick="fav('+p.id+')">'+(S.fav.indexOf(p.id)>=0?"♥":"♡")+'</button></div><b style="font-size:1.3rem">'+p.n+'</b><div class="mu" style="margin-bottom:14px">'+p.s+'</div><div class="card"><div class="st" style="border:0;padding:0"><div>'+i("bed")+'<br>'+p.h+' Habitaciones</div><div>'+i("bath")+'<br>'+p.b+' Baños</div><div>'+i("area")+'<br>'+p.m+' metros</div></div></div><p style="line-height:1.5">'+p.d+'</p><div class="sh">GALERÍA</div><div class="gal" style="background:linear-gradient(135deg,#bcd4ec,#8fa8c8)">🛋️</div><div class="gal" style="background:linear-gradient(135deg,#e8d5b5,#b99a6a)">🍳</div><button class="btn n" onclick="go(\'simulador\')" style="margin-bottom:10px">Simulador</button><button class="btn g" onclick="go(\'agendar\')" style="margin-bottom:10px">Agendar visita</button>'+tel()+'<div style="height:10px"></div><button class="btn g" onclick="go(\'home\')">Volver al Panel</button></div>'+nav();}
